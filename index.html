<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipAI</title>
<meta name="description" content="ClipAI: clips, downloads, QR codes, voice and text in Telegram. Khmer + English.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Noto+Sans+Khmer:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--ink:#12263a;--mute:#4b6178;--line:#c9d6e3;--gold:#f2b01e;--btn:#1565c0;--btn-ink:#fff;--bar:#b9c9da}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a27;--ink:#e6eef6;--mute:#9bb0c5;--line:#26394d;--btn:#5aa8ff;--btn-ink:#0e1a27;--bar:#2c4259}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 "Bricolage Grotesque","Noto Sans Khmer",system-ui,sans-serif}
html[lang=km] body{line-height:1.9}
.wrap{max-width:1040px;margin:0 auto;padding:0 clamp(1.1rem,4vw,2rem)}
header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.9rem;background:none;color:var(--mute);border:0;padding:.35rem .9rem;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hero{padding:clamp(2rem,7vw,5rem) 0 2.5rem}
h1{font-weight:800;font-size:clamp(2.2rem,6.4vw,4.4rem);line-height:1.08;letter-spacing:-.025em;margin:0 0 1.2rem;max-width:16ch}
html[lang=km] h1{line-height:1.4;letter-spacing:0;max-width:20ch}
.lead{max-width:60ch;color:var(--mute);font-size:1.15rem;margin:0 0 2rem}
.cta{display:inline-block;background:var(--btn);color:var(--btn-ink);font-weight:700;text-decoration:none;padding:.9rem 1.6rem;border-radius:12px}
.cta:hover{filter:brightness(1.08)}
.strip{margin:2.5rem 0 0;padding:1.5rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bars{display:flex;align-items:center;gap:3px;height:96px}
.bar{flex:1;min-width:2px;border-radius:2px;background:var(--bar);transition:background .35s ease var(--d,0s)}
.bar.pick.on{background:var(--gold)}
.strip p{margin:1rem 0 0;color:var(--mute);max-width:64ch}
.sizes{display:flex;gap:.8rem;align-items:flex-end;margin-top:1rem}
.sizes span{border:2px solid var(--gold);border-radius:4px;display:block}
.sizes .v{width:22px;height:39px}.sizes .h{width:48px;height:27px}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.2;letter-spacing:-.015em;margin:0 0 1.5rem}
html[lang=km] h2{line-height:1.5;letter-spacing:0}
section{padding:3.5rem 0 0}
.feat{display:grid;gap:0 3rem;grid-template-columns:1fr}
@media (min-width:720px){.feat{grid-template-columns:1fr 1fr}}
.feat div{border-top:1px solid var(--line);padding:1.1rem 0 1.4rem}
.feat h3{margin:0 0 .3rem;font-size:1.2rem}
.feat p{margin:0;color:var(--mute);max-width:46ch}
ol{list-style:none;margin:0;padding:0;display:grid;gap:1.5rem;grid-template-columns:1fr}
@media (min-width:720px){ol{grid-template-columns:repeat(3,1fr)}}
ol li{display:grid;grid-template-columns:2.4rem 1fr;gap:.2rem .8rem;align-items:start}
ol b{grid-row:1/3;display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--gold);color:#12263a;font-weight:800}
ol strong{font-size:1.1rem}ol span{color:var(--mute)}
.end{margin-top:4rem;padding:2.5rem 0 3rem;border-top:1px solid var(--line)}
.end p{color:var(--mute);margin:0 0 1.5rem}
footer{border-top:1px solid var(--line);padding:1.25rem 0 2rem;color:var(--mute);font-size:.95rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="logo">✂️ ClipAI</span>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="km" aria-pressed="true">ខ្មែរ</button><button data-l="en" aria-pressed="false">English</button>
  </div>
</header>

<main>
<div class="hero">
  <h1 data-i="h1"></h1>
  <p class="lead" data-i="lead"></p>
  <a class="cta" href="https://t.me/YOUR_BOT_USERNAME" data-i="cta"></a>
  <div class="strip" aria-hidden="false">
    <div class="bars" id="bars" role="img" aria-label="Sound wave of a long video with six highlighted moments"></div>
    <p data-i="strip"></p>
    <div class="sizes" aria-label="9:16 and 16:9"><span class="v"></span><span class="h"></span></div>
  </div>
</div>

<section>
  <h2 data-i="ft"></h2>
  <div class="feat">
    <div><h3 data-i="f1t"></h3><p data-i="f1d"></p></div>
    <div><h3 data-i="f2t"></h3><p data-i="f2d"></p></div>
    <div><h3 data-i="f3t"></h3><p data-i="f3d"></p></div>
    <div><h3 data-i="f4t"></h3><p data-i="f4d"></p></div>
    <div><h3 data-i="f5t"></h3><p data-i="f5d"></p></div>
    <div><h3 data-i="f6t"></h3><p data-i="f6d"></p></div>
  </div>
</section>

<section>
  <h2 data-i="ht"></h2>
  <ol>
    <li><b>1</b><strong data-i="s1t"></strong><span data-i="s1d"></span></li>
    <li><b>2</b><strong data-i="s2t"></strong><span data-i="s2d"></span></li>
    <li><b>3</b><strong data-i="s3t"></strong><span data-i="s3d"></span></li>
  </ol>
</section>

<div class="end">
  <h2 data-i="eh"></h2>
  <p data-i="ep"></p>
  <a class="cta" href="https://t.me/YOUR_BOT_USERNAME" data-i="cta"></a>
</div>
</main>
<footer data-i="foot"></footer>
</div>

<script>
const I={
en:{title:"ClipAI – clips, voice and downloads in Telegram",
h1:"Turn long videos into short clips, right in Telegram.",
lead:"Send a link. ClipAI finds the best moments, cuts them to 9:16 and 16:9, and sends them back. It also downloads, transcribes and speaks, in Khmer and English.",
cta:"Open ClipAI in Telegram",
strip:"ClipAI listens for the loudest, busiest moments and cuts up to six clips of about one minute.",
ft:"What it does",
f1t:"✂️ Clip a video",f1d:"Paste a YouTube, TikTok, X or Vimeo link. Get 5–6 clips of about a minute, vertical and landscape.",
f2t:"🎬 Auto Cut",f2d:"Send 2–10 videos and an mp3. Choose format, length and quality. Get one finished video that fits your music.",
f3t:"⬇️ Download",f3d:"Paste a link and get the video as MP4, or just the audio as MP3.",
f4t:"🔳 QR Code",f4d:"Send a link or text. Get a QR code image.",
f5t:"📝 Voice to Text",f5d:"Send a link, a voice message, an mp3 or a video. AI writes out the words.",
f6t:"🎙 Text to Voice",f6d:"Send text in Khmer or English, any length. Hear it in a natural voice: woman, girl, man or deep man.",
ht:"How it works",
s1t:"Open the bot",s1d:"Tap the button above, then Start in Telegram.",
s2t:"Send what you have",s2d:"A link, a file or text. The bot shows buttons for your options.",
s3t:"Get the result",s3d:"Clips, video, audio or text arrive in the same chat.",
eh:"Ready to try it?",ep:"Open the bot, tap Start, and choose your language.",
foot:"Built by Xing Hout"},
km:{title:"ClipAI – ឃ្លីប សំឡេង និងទាញយក ក្នុង Telegram",
h1:"បំប្លែងវីដេអូវែងទៅជាឃ្លីបខ្លី ក្នុង Telegram។",
lead:"ផ្ញើតំណមក។ ClipAI រកផ្នែកល្អបំផុត កាត់ជា 9:16 និង 16:9 ហើយផ្ញើត្រឡប់មកវិញ។ វាក៏ទាញយក សរសេរអត្ថបទពីសំឡេង និងអានអត្ថបទជាសំឡេងផងដែរ ជាភាសាខ្មែរ និងអង់គ្លេស។",
cta:"បើក ClipAI ក្នុង Telegram",
strip:"ClipAI ស្តាប់រកផ្នែកដែលមានសំឡេងខ្លាំង និងសកម្មភាពច្រើន ហើយកាត់ជាឃ្លីបប្រហែលមួយនាទីរហូតដល់ប្រាំមួយ។",
ft:"អ្វីដែលវាអាចធ្វើបាន",
f1t:"✂️ កាត់វីដេអូ",f1d:"បិទភ្ជាប់តំណ YouTube, TikTok, X ឬ Vimeo ទទួលបានឃ្លីប ៥–៦ ប្រវែងប្រហែលមួយនាទី ទាំងបញ្ឈរ និងផ្ដេក។",
f2t:"🎬 កាត់ស្វ័យប្រវត្តិ",f2d:"ផ្ញើវីដេអូ ២–១០ និង mp3។ ជ្រើសរើសទម្រង់ ប្រវែង និងគុណភាព ទទួលបានវីដេអូមួយដែលត្រូវនឹងតន្ត្រីរបស់អ្នក។",
f3t:"⬇️ ទាញយក",f3d:"បិទភ្ជាប់តំណ ហើយទទួលបានវីដេអូជា MP4 ឬសំឡេងតែប៉ុណ្ណោះជា MP3។",
f4t:"🔳 QR កូដ",f4d:"ផ្ញើតំណ ឬអត្ថបទ ទទួលបានរូប QR កូដ។",
f5t:"📝 សំឡេងទៅអត្ថបទ",f5d:"ផ្ញើតំណ សារសំឡេង mp3 ឬវីដេអូ AI នឹងសរសេរពាក្យដែលនិយាយចេញមក។",
f6t:"🎙 អត្ថបទទៅជាសំឡេង",f6d:"ផ្ញើអត្ថបទជាភាសាខ្មែរ ឬអង់គ្លេស ប្រវែងប៉ុន្មានក៏បាន ហើយស្តាប់ជាសំឡេងធម្មជាតិ៖ ស្រី ក្មេងស្រី ប្រុស ឬប្រុសសំឡេងធ្ងន់។",
ht:"របៀបប្រើ",
s1t:"បើកបូត",s1d:"ចុចប៊ូតុងខាងលើ ហើយចុច Start ក្នុង Telegram។",
s2t:"ផ្ញើអ្វីដែលអ្នកមាន",s2d:"តំណ ឯកសារ ឬអត្ថបទ។ បូតបង្ហាញប៊ូតុងជម្រើសឲ្យអ្នក។",
s3t:"ទទួលលទ្ធផល",s3d:"ឃ្លីប វីដេអូ សំឡេង ឬអត្ថបទ មកដល់ក្នុងការជជែកតែមួយ។",
eh:"ត្រៀមសាកល្បងហើយឬនៅ?",ep:"បើកបូត ចុច Start ហើយជ្រើសរើសភាសារបស់អ្នក។",
foot:"បង្កើតដោយ Xing Hout"}};

function setLang(l){
  document.documentElement.lang=l; document.title=I[l].title;
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=I[l][e.dataset.i]});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===l)));
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
let start="km";
try{
  const saved=localStorage.getItem("lang");
  start=saved||((navigator.language||"").slice(0,2)==="km"?"km":"en");
}catch(e){}
if(!I[start])start="km";
setLang(start);

// sound-wave strip: six highlighted moments light up once on load
const box=document.getElementById("bars"),picks=[5,17,28,41,53,64],N=74;
for(let i=0;i<N;i++){
  const b=document.createElement("i"); b.className="bar";
  const h=18+70*Math.abs(Math.sin(i*.61)*Math.cos(i*.23+1)); b.style.height=h+"%";
  const k=picks.findIndex(p=>i>=p&&i<p+4);
  if(k>-1){b.classList.add("pick");b.style.setProperty("--d",(k*.25+(i-picks[k])*.04)+"s")}
  box.appendChild(b);
}
const go=()=>box.querySelectorAll(".pick").forEach(b=>b.classList.add("on"));
matchMedia("(prefers-reduced-motion:reduce)").matches?go():setTimeout(go,350);
</script>
</body>
</html>
