<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClipAI</title>
<meta name="description" content="ClipAI: clips, downloads, QR codes, voice and text in Telegram. Khmer + English.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#fff;--mute:#aeb6bf;--dim:#7d8791;--line:rgba(255,255,255,.12);--glass:rgba(10,12,14,.72);--teal:#19c3b1;--green:#2ee59d;--red:#ff4d5e;--gold:#f2b01e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Inter,"Noto Sans Khmer",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[lang=km] body{line-height:1.85}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(1.1rem,4vw,2rem)}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:74px;gap:1rem}
.logo{display:flex;align-items:center;gap:.65rem;font-weight:800;font-size:1.2rem}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#15181b;border:1px solid var(--line);font-style:normal;font-size:1.05rem}
.links{display:none;gap:1.6rem;font-weight:600;font-size:.92rem}
.links a{color:#e9edf1}.links a:hover{color:var(--teal)}
@media(min-width:900px){.links{display:flex}}
.right{display:flex;align-items:center;gap:.8rem}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.85rem;background:none;color:var(--mute);border:0;padding:.3rem .8rem;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:#000;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:.5rem;background:#fff;color:#000;font-weight:700;border-radius:12px;padding:.62rem 1.1rem;font-size:.93rem}
.pill:hover{background:#e9edf1}
.nav .pill{display:none}
@media(min-width:560px){.nav .pill{display:inline-flex}}

/* ticker */
.tick{border-bottom:1px solid var(--line);background:#050607;overflow:hidden;white-space:nowrap}
.tick div{display:inline-flex;gap:2.6rem;padding:.7rem 0;animation:run 38s linear infinite;font-size:.85rem}
.tick b{font-weight:700;margin-right:.45rem}.up{color:var(--green)}.dn{color:var(--red)}
.tick em{font-style:normal;font-size:.7rem;color:var(--dim);background:rgba(255,255,255,.07);padding:.05rem .4rem;border-radius:5px;margin-left:.4rem}
@keyframes run{to{transform:translateX(-50%)}}

/* hero */
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:calc(100svh - 120px);display:flex;align-items:center;padding:4rem 0 6rem}
.net{position:absolute;inset:0;z-index:-2;background:radial-gradient(60% 70% at 70% 45%,#0b5d6b 0%,#07323f 45%,#02080c 100%)}
.net svg{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.45) 100%),linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.85))}
.grid{display:grid;gap:2.5rem;align-items:center;width:100%}
@media(min-width:960px){.grid{grid-template-columns:1.15fr .85fr}}
.badge{display:inline-flex;align-items:center;gap:.6rem;border:1px solid var(--line);background:rgba(0,0,0,.45);border-radius:999px;padding:.35rem 1rem;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#dfe5ea}
html[lang=km] .badge{letter-spacing:.02em;text-transform:none;font-size:.82rem}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
h1{font-weight:800;font-size:clamp(2.6rem,6.6vw,5rem);line-height:1.04;letter-spacing:-.035em;margin:1.4rem 0 1.4rem;max-width:12ch}
html[lang=km] h1{line-height:1.35;letter-spacing:0;max-width:14ch}
h1 span{color:#9aa3ab}
.lead{max-width:56ch;color:#d4dae0;font-size:1.12rem;margin:0 0 2rem}
.btns{display:flex;flex-wrap:wrap;gap:.8rem}
.btns .pill{padding:.95rem 1.6rem;font-size:1rem}
.ghost{display:inline-flex;align-items:center;gap:.5rem;background:rgba(10,12,14,.75);border:1px solid var(--line);color:#fff;font-weight:600;border-radius:12px;padding:.95rem 1.5rem}
.ghost:hover{border-color:rgba(255,255,255,.35)}
.proof{display:flex;align-items:center;gap:.9rem;margin-top:2.2rem;color:var(--mute);font-size:.92rem}
.dots{display:flex}.dots i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.9rem;color:#000;margin-left:-8px;border:2px solid #05080a}
.dots i:first-child{margin-left:0}

/* founder card */
.win{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:1.2rem;backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.5);max-width:520px;width:100%;justify-self:end}
.win-h{display:flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#d8e6ea;margin-bottom:1rem}
html[lang=km] .win-h{letter-spacing:0;text-transform:none;font-size:.85rem}
.win-h i{width:10px;height:10px;border-radius:50%}
.win-h .tag{margin-left:auto;color:var(--green);background:rgba(46,229,157,.12);padding:.15rem .6rem;border-radius:8px;letter-spacing:0;text-transform:none}
.who{background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:20px;padding:1rem}
.who-top{display:flex;align-items:center;gap:1rem}
.who img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:2px solid #b9955a}
.who h3{margin:0;font-size:1.1rem;display:flex;align-items:center;gap:.4rem}
.who h3 svg{width:17px;height:17px;color:var(--green)}
.who small{color:var(--dim)}
.who .stat{margin-left:auto;color:var(--green);background:rgba(46,229,157,.12);font-weight:700;font-size:.74rem;padding:.3rem .7rem;border-radius:9px}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1rem}
.soc a{text-align:center;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:.5rem;font-size:.8rem;font-weight:600}
.soc a:hover{background:rgba(255,255,255,.1)}

/* sections */
section{padding:5rem 0 0}
h2{font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.15;letter-spacing:-.025em;margin:0 0 2rem;font-weight:800}
html[lang=km] h2{line-height:1.5;letter-spacing:0}
.feat{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:640px){.feat{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.feat{grid-template-columns:repeat(3,1fr)}}
.card{background:linear-gradient(180deg,#0d1114,#07090b);border:1px solid var(--line);border-radius:20px;padding:1.5rem;transition:border-color .2s}
.card:hover{border-color:rgba(25,195,177,.5)}
.card h3{margin:0 0 .45rem;font-size:1.15rem}
.card p{margin:0;color:var(--mute)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps li{display:grid;grid-template-columns:2.5rem 1fr;gap:.2rem .9rem;align-items:start;background:#07090b;border:1px solid var(--line);border-radius:20px;padding:1.4rem}
.steps b{grid-row:1/3;display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:50%;background:var(--teal);color:#000;font-weight:800}
.steps strong{font-size:1.08rem}.steps span{color:var(--mute)}
.end{margin:5rem 0 0;padding:3rem 0 3.5rem;border-top:1px solid var(--line);text-align:center}
.end p{color:var(--mute);margin:0 0 1.6rem}
footer{border-top:1px solid var(--line);padding:1.3rem 0 5rem;color:var(--dim);font-size:.9rem;text-align:center}

/* floating telegram */
.float{position:fixed;right:max(1rem,env(safe-area-inset-right,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:.7rem;background:rgba(5,15,25,.9);border:1px solid rgba(60,160,230,.55);border-radius:999px;padding:.45rem 1.1rem .45rem .5rem;backdrop-filter:blur(10px);font-size:.82rem;font-weight:700;line-height:1.25}
.float i{width:38px;height:38px;border-radius:50%;background:#2aa3e6;display:grid;place-items:center}
.float svg{width:20px;height:20px}
.float small{display:block;color:#6ec1f5;font-size:.65rem;letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tick div{animation:none}}
</style>
</head>

function setLang(l){
  document.documentElement.lang=l;document.title=I[l].title;
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=I[l][e.dataset.i]});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===l)));
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));

// cellular network background
(function(){
  const W=1600,H=900,svg=document.getElementById("net");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const c=9,r=5,pts=[];
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let y=0;y<=r;y++){pts[y]=[];for(let x=0;x<=c;x++)pts[y][x]=[x*W/c+(rnd()-.5)*W/c*.8,y*H/r+(rnd()-.5)*H/r*.8]}
  let d="";
  for(let y=0;y<=r;y++)for(let x=0;x<=c;x++){
    const p=pts[y][x];
    if(x<c){const q=pts[y][x+1];d+="M"+p+"Q"+((p[0]+q[0])/2+(rnd()-.5)*60)+","+((p[1]+q[1])/2+(rnd()-.5)*60)+" "+q}
    if(y<r){const q=pts[y+1][x];d+="M"+p+"Q"+((p[0]+q[0])/2+(rnd()-.5)*60)+","+((p[1]+q[1])/2+(rnd()-.5)*60)+" "+q}
    if(x<c&&y<r&&rnd()>.55){const q=pts[y+1][x+1];d+="M"+p+"L"+q}
  }
  svg.innerHTML='<defs><filter id="g"><feGaussianBlur stdDeviation="9"/></filter></defs>'+
   '<path d="'+d+'" fill="none" stroke="#e6a96a" stroke-opacity=".55" stroke-width="7" filter="url(#g)"/>'+
   '<path d="'+d+'" fill="none" stroke="#cfd8dc" stroke-opacity=".6" stroke-width="2.2"/>';
})();
